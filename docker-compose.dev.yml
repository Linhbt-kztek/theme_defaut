version: '3.8'

services:
    app:
        image: kztek/theme:dev
        restart: unless-stopped
        ports:
            - "8564:80"
        build:
            context: .
            dockerfile: Dockerfile
        volumes:
            - ./.env:/var/www/html/.env # File cấu hình môi trường  
            - ./app:/var/www/html/app # Thư mục chứa mã nguồn ứng dụng  
            - ./config:/var/www/html/config # Thư mục cấu hình  
            - ./database:/var/www/html/database # Thư mục chứa cơ sở dữ liệu  
            - ./public:/var/www/html/public # Thư mục chứa file công khai như CSS, JS, hình ảnh  
            - ./resources:/var/www/html/resources # Thư mục chứa tài nguyên công việc như view và lang  
            - ./routes:/var/www/html/routes # Thư mục chứa định nghĩa route  
        networks:
            - network-theme
        depends_on:
            - mysql
    
    mysql:
        image: mysql:8.0
        restart: unless-stopped
        volumes:
            - ./data-mysql:/var/lib/mysql
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        env_file:
            - ".env"
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        networks:
            - network-theme

